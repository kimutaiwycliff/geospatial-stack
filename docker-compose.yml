---
# Prod-like base compose file (brief §9). Every service besides `proxy` stays
# on the internal Docker network -- only Caddy publishes host ports, even in
# local dev, so the network topology matches what will run on the VPS later.
# `docker-compose.override.yml` layers local-only conveniences (extra exposed
# ports for direct DB/MinIO access while developing) on top of this file.
#
# `restart: unless-stopped` on every long-running service (added per a
# production-readiness audit finding: nothing restarted automatically
# before this, so a crashed container just stayed down until someone ran
# `docker compose up` by hand). Deliberately NOT applied to `migrate` and
# `basemap` -- both are one-shot jobs designed to exit 0 and stay exited;
# `depends_on: condition: service_completed_successfully` (used by every
# service that waits on `migrate`) requires that terminal "exited 0, not
# restarting" state, which `unless-stopped` would undermine.
#
# `mem_limit`/`cpus` on every service (same audit finding: nothing capped
# resource usage, so `worker` -- which runs DuckDB/GDAL/tippecanoe against
# arbitrary uploaded data -- could OOM the whole host). Legacy top-level
# keys (not `deploy.resources.limits`) since this stack only ever runs via
# `docker compose up`, never `docker stack deploy`/Swarm. `worker` gets the
# most headroom, matching docs/deploy.md's own documented "2-3GB RAM" real
# usage for tiling a non-trivial dataset.

services:
  # --- Canonical spatial database ------------------------------------------
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only against a fresh (empty) volume -- Postgres's own
      # convention for docker-entrypoint-initdb.d. Keeps `CREATE EXTENSION`
      # (needs superuser) out of dbmate's tracked migrations, which run as
      # the app role and only ever manage schemas/tables.
      - ./db/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
    healthcheck:
      # pg_isready proves the server accepts connections; migrate/api/martin
      # all wait on this via `condition: service_healthy` -- never `sleep`.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- One-shot schema migration runner --------------------------------------
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    # dbmate reads DATABASE_URL from .env; runs once and exits 0 on success.
    # --no-dump-schema: dbmate's default `up` behavior re-dumps db/schema.sql
    # from whatever the LIVE database currently looks like on every single
    # run -- including `published.<table>` tables the ETL pipeline creates
    # dynamically (worker/tasks.py's load_postgis_task), which db/migrations/
    # never declares at all. That made schema.sql non-deterministic in git:
    # it churned between "has the demo LandMark tables" and "doesn't" purely
    # based on whichever dev's local DB happened to have ingested data before
    # their last `make up`. schema.sql should track db/migrations/ (the
    # actual source of truth), not incidental pipeline output -- `make
    # dump-schema` regenerates it deliberately instead.
    command: ["--wait", "--no-dump-schema", "up"]

  # --- One-shot self-hosted basemap build (brief §1.5) -----------------------
  # Same "runs once and exits 0" shape as `migrate` -- extracts a world,
  # low/mid-zoom PMTiles subset from Protomaps' public daily build and
  # uploads it to `basemap/basemap.pmtiles`, which is what MapLibre actually
  # renders underneath every dataset layer (web/src/lib/basemapStyle.ts).
  # Without this service the object never gets created and the map renders
  # with no basemap at all -- this used to be a manual, undocumented step
  # (basemap/build_basemap.py run by hand); wiring it in here means `make up`/
  # `make fresh-start` produce a working map with zero extra commands.
  # Only depends on `storage` (not `db`/`migrate`) since it never touches
  # Postgres. The script itself is idempotent (skips the extract+upload if
  # the object already exists, see `_already_built`), so re-running this on
  # every `docker compose up` -- same as `migrate` -- costs one cheap
  # HEAD request once the basemap has been built.
  basemap:
    build:
      context: ./basemap
      dockerfile: Dockerfile
    mem_limit: 512m
    depends_on:
      storage:
        condition: service_healthy
    env_file: .env

  # --- Dynamic vector tiles from PostGIS -------------------------------------
  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - ./tiles/martin:/config
    command: ["--config", "/config/config.yaml"]

  # --- Public read API + auth-gated admin + job triggers ---------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Celery worker: validate / curate / tile / ingest (core, brief §2) ----
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Highest ceiling of any service -- DuckDB/GDAL/tippecanoe against a
    # real (non-fixture) dataset is documented (docs/deploy.md) at 2-3GB;
    # 3g/2.0 gives that headroom without leaving the limit effectively
    # unbounded.
    mem_limit: 3g
    cpus: 2.0
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: .env
    # Source files an engineer drops in for ingestion (brief §1.1/§1.3) --
    # read-only, since ingest_task only ever reads from here; it writes
    # everything downstream to object storage/PostGIS, never back to disk.
    volumes:
      - ./data:/data:ro

  # --- Celery monitoring dashboard --------------------------------------------
  flower:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    command: ["celery", "-A", "worker.celery_app", "flower", "--port=5555"]
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env

  # --- Broker + result backend for Celery -------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- S3-compatible object store (default; swap to R2 via .env S3_* vars) --
  storage:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Static frontend build, served by nginx ---------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # Empty default (no-op Sentry, same contract as every other DSN in
      # this stack) -- set VITE_SENTRY_DSN in .env and rebuild `web` once a
      # real frontend Sentry project exists (see web/src/main.tsx).
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - api

  # --- Observability: Prometheus + exporters + Grafana (brief §12) ----------
  # Postgres exporter -- DATA_SOURCE_NAME reuses the same DATABASE_URL .env
  # already defines for dbmate/Martin/the API, rather than a second set of
  # DB credentials to keep in sync. postgres_exporter accepts the
  # `postgres://` scheme fine; no need for a `postgresql://` rewrite.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}

  # Hand-rolled Celery queue-depth exporter -- see api/worker/queue_exporter.py
  # for why (no maintained off-the-shelf Celery Prometheus exporter exists).
  # Shares the api/worker image since it's a few lines of Python that reads
  # the same REDIS_URL the worker already uses as its broker.
  celery-exporter:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: ["python", "-m", "worker.queue_exporter"]
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - martin
      - postgres-exporter
      - celery-exporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      # Provisioning-via-files (datasource + dashboard both load from
      # ops/grafana/provisioning on boot -- see that directory) is the part
      # that must not require manual UI setup; admin login itself still
      # needs *some* credential, so it comes from .env like every other
      # service credential in this stack rather than Grafana's own
      # "admin/admin, change it later" default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # No public sign-up / anonymous access on a box that's otherwise
      # locked down to Caddy-fronted traffic only (brief §10).
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # Log store (brief follow-up: "collects logs well") -- see
  # ops/loki/loki-config.yml for why filesystem-only/single-node.
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  # Ships every container's stdout/stderr into Loki -- see
  # ops/promtail/promtail-config.yml for the Docker-service-discovery
  # approach and its documented docker.sock tradeoff.
  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki

  # --- Edge: TLS, routing, compression, cache, rate limit --------------------
  # Only this service publishes host ports -- PostGIS/Redis/MinIO/API are
  # reachable only on the internal Docker network (brief §10).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - web
      - api
      - martin
      - storage
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
