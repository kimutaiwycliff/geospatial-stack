# Minimal static-file server for the built SPA. Lives at web/nginx.conf and
# gets copied into the runtime stage of web/Dockerfile.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-fallback: any path nginx doesn't have a real file for
    # falls back to index.html so React Router (added in Phase 1, once
    # there's more than one route) can render it client-side instead of
    # nginx 404ing on a deep link/refresh. Phase 0 only has one route, but
    # this is the one line that has to be right from the start -- retrofitting
    # it later means finding out in front of a client that a shared/refreshed
    # URL 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's default build output) are safe to cache
    # forever -- a new deploy ships new filenames, never mutates old ones.
    # NOTE: this /assets/ is Vite's own JS/CSS bundle directory, unrelated to
    # Caddy's /objects/* route (which proxies straight to MinIO, see
    # caddy/Caddyfile) -- Caddy matches and intercepts that path before it
    # would ever reach this nginx, so the two "assets" concepts never collide.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Stock nginx's mime.types has no entry for .mjs, so it falls back to
    # `default_type` (application/octet-stream). Browsers enforce strict MIME
    # checking for ES modules -- a module <script> or `new Worker(url, {type:
    # "module"})` served as octet-stream fails to load with an opaque,
    # message-less error, not a normal 404/network failure. This is exactly
    # what broke MapLibre's tile-decoding worker (public/maplibre-gl-worker.mjs
    # + maplibre-gl-shared.mjs, copied in by scripts/copy-maplibre-worker.mjs)
    # -- found only by intercepting the Worker object's own error event in a
    # live browser, since nothing else about the failure was diagnosable.
    location ~ \.mjs$ {
        default_type application/javascript;
    }
}
